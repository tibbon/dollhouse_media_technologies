<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Fractal Dive</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; cursor: crosshair; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #ui {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-family: 'SF Mono', 'Fira Code', monospace;
    color: rgba(255,255,255,0.25); font-size: 11px; letter-spacing: 0.08em;
    pointer-events: none; z-index: 10; text-align: center;
    text-transform: uppercase; line-height: 1.8;
  }
  #ui span { opacity: 0; animation: fadeIn 3s 2s forwards; }
  @keyframes fadeIn { to { opacity: 1; } }
  #fps {
    position: fixed; top: 16px; right: 16px;
    font-family: 'SF Mono', monospace; color: rgba(255,255,255,0.2);
    font-size: 10px; pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><span>scroll to dive &middot; shift-scroll to roll &middot; right-drag to rotate<br>mouse to look &middot; space to pause &middot; R to reset</span></div>
<div id="fps"></div>

<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: false });
if (!gl) { document.body.innerHTML = '<p style="color:#fff;padding:2em;">WebGL2 required</p>'; }

const vertSrc = `#version 300 es
in vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
`;

const fragSrc = `#version 300 es
precision highp float;

uniform vec2 u_res;
uniform float u_time;
uniform vec3 u_ro;
uniform vec3 u_fwd;
uniform vec3 u_right;
uniform vec3 u_up;
uniform float u_zoom;

out vec4 fragColor;

mat2 rot(float a) {
    float c = cos(a), s = sin(a);
    return mat2(c, -s, s, c);
}

float hash(vec3 p) {
    p = fract(p * 0.3183099 + 0.1);
    p *= 17.0;
    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

vec3 palette(float t, vec3 a, vec3 b, vec3 c, vec3 d) {
    return a + b * cos(6.28318 * (c * t + d));
}

// ——— Mandelbox with deep breathing ———

vec2 mandelbox(vec3 pos, float time) {
    // All parameters on different slow cycles so they never repeat the same combo
    float scale = mix(2.3, 2.9, 0.5 + 0.5 * sin(time * 0.053))
                + 0.08 * sin(time * 0.017 + 0.5);  // ultra-slow drift

    float foldLimit = mix(0.95, 1.15, 0.5 + 0.5 * sin(time * 0.041 + 1.0))
                    + 0.04 * cos(time * 0.013);      // breathing fold boundary

    float minRadius2 = mix(0.2, 0.5, 0.5 + 0.5 * cos(time * 0.047))
                      + 0.06 * sin(time * 0.011 + 2.0); // sphere fold breathes

    float fixedRadius2 = 1.0 + 0.05 * sin(time * 0.0091); // even fixed radius shifts

    // Twist envelope — swells and recedes on a ~90 second cycle
    float twistAmp = 0.08 + 0.06 * sin(time * 0.0071)
                          + 0.03 * sin(time * 0.019 + 1.0);

    // Per-iteration twist phase drift
    float twistPhase = time * 0.021;

    vec3 offset = pos;
    float dr = 1.0;
    vec3 z = pos;
    float trap = 1e10;

    for (int i = 0; i < 10; i++) {
        z = clamp(z, -foldLimit, foldLimit) * 2.0 - z;
        float r2 = dot(z, z);
        if (r2 < minRadius2) { float t2 = fixedRadius2/minRadius2; z *= t2; dr *= t2; }
        else if (r2 < fixedRadius2) { float t2 = fixedRadius2/r2; z *= t2; dr *= t2; }

        // Each iteration twists on its own frequency — creates the "geometry turning
        // inside out" feeling as different layers rotate at different rates
        float fi = float(i);
        float twXZ = twistAmp * sin(twistPhase + fi * 0.73);
        float twYZ = twistAmp * 0.7 * cos(twistPhase * 0.83 + fi * 1.1);
        float twXY = twistAmp * 0.4 * sin(twistPhase * 0.67 + fi * 0.51 + 1.5);
        z.xz *= rot(twXZ);
        z.yz *= rot(twYZ);
        z.xy *= rot(twXY);

        z = z * scale + offset;
        dr = dr * abs(scale) + 1.0;

        trap = min(trap, length(z.xz));
        trap = min(trap, abs(z.y));
    }
    return vec2(length(z) / abs(dr), trap);
}

// ——— Kali IFS with breathing ———

vec2 kaliIFS(vec3 p, float time) {
    // Scale breathes
    float scale = mix(1.8, 2.25, 0.5 + 0.5 * sin(time * 0.037))
                + 0.06 * sin(time * 0.0083 + 1.0);

    // Offset vector slowly orbits — this shifts the whole geometry
    vec3 offset = vec3(
        1.0 + 0.12 * sin(time * 0.029) + 0.05 * sin(time * 0.0067),
        0.92 + 0.12 * cos(time * 0.033) + 0.04 * cos(time * 0.0053 + 0.7),
        1.05 + 0.1  * sin(time * 0.041 + 2.0) + 0.05 * sin(time * 0.0079 + 1.3)
    );

    // Twist envelope for IFS — different period than mandelbox
    float twistAmp = 0.06 + 0.04 * sin(time * 0.0059)
                          + 0.025 * cos(time * 0.023 + 2.0);
    float twistPhase = time * 0.015;

    float trap = 1e10;
    vec3 z = p;
    float dr = 1.0;

    for (int i = 0; i < 8; i++) {
        z = abs(z);
        if (z.x-z.y < 0.0) z.xy = z.yx;
        if (z.x-z.z < 0.0) z.xz = z.zx;
        if (z.y-z.z < 0.0) z.yz = z.zy;

        // Per-iteration twist — feels like the kaleidoscope is slowly turning
        float fi = float(i);
        float tw1 = twistAmp * sin(twistPhase + fi * 0.61);
        float tw2 = twistAmp * 0.6 * cos(twistPhase * 0.77 + fi * 0.89);
        z.xz *= rot(tw1);
        z.xy *= rot(tw2);

        z = z * scale - offset * (scale - 1.0);
        dr = dr * scale + 1.0;

        trap = min(trap, length(z.xy));
        trap = min(trap, abs(z.z));
    }
    return vec2(length(z) / dr, trap);
}

// ——— Combined — the blend itself also breathes ———

vec2 scene(vec3 p, float time) {
    // World-space rotations — slow and layered
    vec3 p1 = p;
    p1.xy *= rot(time * 0.009 + 0.02 * sin(time * 0.0061));
    p1.yz *= rot(time * 0.006 + 0.015 * cos(time * 0.0047));

    vec3 p2 = p;
    p2.xz *= rot(time * 0.011 + 2.0 + 0.02 * sin(time * 0.0073));
    p2.yz *= rot(sin(time * 0.008) * 0.35 + 0.01 * cos(time * 0.0037));

    vec2 d1 = mandelbox(p1, time);
    vec2 d2 = kaliIFS(p2 * 0.55, time); d2.x /= 0.55;

    // Blend radius breathes — controls how much the two fractals merge
    float k = 0.2 + 0.12 * sin(time * 0.015)
                   + 0.06 * sin(time * 0.0043 + 1.0);  // slow extra modulation

    float h = clamp(0.5 + 0.5*(d2.x-d1.x)/k, 0.0, 1.0);
    return vec2(
        mix(d2.x,d1.x,h) - k*h*(1.0-h),
        mix(d2.y,d1.y,h)
    );
}

float sceneDist(vec3 p, float time) { return scene(p, time).x; }

float calcAO(vec3 pos, vec3 nor, float time) {
    float occ = 0.0, sca = 1.0;
    for (int i = 0; i < 4; i++) {
        float h = 0.008 + 0.12*float(i)/3.0;
        occ += (h - sceneDist(pos + h*nor, time)) * sca;
        sca *= 0.8;
    }
    return clamp(1.0 - 3.0*occ, 0.0, 1.0);
}

vec3 calcNormal(vec3 p, float time) {
    vec2 e = vec2(0.0004, 0.0);
    return normalize(vec3(
        sceneDist(p+e.xyy,time)-sceneDist(p-e.xyy,time),
        sceneDist(p+e.yxy,time)-sceneDist(p-e.yxy,time),
        sceneDist(p+e.yyx,time)-sceneDist(p-e.yyx,time)));
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5*u_res) / u_res.y;
    float time = u_time;
    vec3 ro = u_ro;
    vec3 rd = normalize(uv.x*u_right + uv.y*u_up + u_zoom*u_fwd);

    float t_march = 0.0; float d; vec3 p; int steps = 0; float trap = 0.0;
    for (int i = 0; i < 100; i++) {
        p = ro + t_march*rd;
        vec2 res = scene(p, time);
        d = res.x; trap = res.y;
        if (abs(d) < 0.0003 || t_march > 20.0) break;
        t_march += d * 0.75;
        steps = i;
    }

    vec3 col = vec3(0.0);
    if (t_march < 20.0) {
        vec3 nor = calcNormal(p, time);
        float ao = calcAO(p, nor, time);
        float colorTime = time*0.022;
        float regime = sin(time*0.011);

        vec3 warm = palette(trap*0.4+colorTime, vec3(.5,.45,.35),vec3(.5,.4,.3),vec3(1,.8,.6),vec3(0,.15,.3));
        vec3 cool = palette(trap*0.4+colorTime*0.8, vec3(.35,.4,.5),vec3(.3,.4,.5),vec3(.6,.8,1),vec3(.3,.15,0));
        vec3 jewel = palette(trap*0.5+colorTime*1.2, vec3(.5,.35,.4),vec3(.5,.5,.45),vec3(.8,1,.7),vec3(.05,.3,.55));

        float ww = max(0.0,regime), wc = max(0.0,-regime), wj = 0.5+0.5*sin(time*0.0073+2.0);
        vec3 matColor = mix(mix(cool,warm,ww/(ww+wc+.001)),jewel,wj*0.35);

        float pv = sin(dot(p,vec3(3.7,2.3,1.9))+time*0.04)*0.5+0.5;
        float pv2 = cos(dot(p,vec3(1.3,4.1,2.7))-time*0.03)*0.5+0.5;
        matColor = mix(matColor, matColor.gbr, pv*0.25);
        matColor = mix(matColor, matColor.brg, pv2*0.15);

        vec3 accent = palette(trap*0.7+colorTime*1.5+0.5, vec3(.5),vec3(.6,.6,.5),vec3(1,1,.8),vec3(0,.33,.67));

        vec3 L1 = normalize(vec3(sin(time*.037),.7+.3*cos(time*.029),cos(time*.043)));
        vec3 L2 = normalize(vec3(-cos(time*.031+1.),-.4,sin(time*.037+2.)));

        float diff1 = max(dot(nor,L1),0.0);
        float diff2 = max(dot(nor,L2),0.0);
        float spec = pow(max(dot(reflect(-L1,nor),-rd),0.0),40.0);
        float fres = pow(1.0-max(dot(nor,-rd),0.0),3.5);
        float sss = max(0.0,dot(rd,-nor+L1*0.3))*0.12;

        col = matColor*(0.07+diff1*0.65)*ao;
        col += matColor*0.5*diff2*0.2*ao;
        col += accent*spec*0.5;
        col += accent*fres*0.2;
        col += matColor*sss;
        col += accent*pow(float(steps)/100.0,2.0)*0.35;

        float fog = 1.0-exp(-t_march*0.12);
        col = mix(col, mix(vec3(.005,.005,.012),matColor*0.04,0.4), fog*0.8);
    } else {
        float bgP = time*0.012;
        col = 0.012*(0.5+0.5*cos(bgP+vec3(0,1,2)))
            + smoothstep(0.997,1.0,hash(vec3(floor(uv*250.0),1.0)))*0.15;
    }

    vec2 q = gl_FragCoord.xy/u_res;
    col *= 0.45+0.55*pow(16.0*q.x*q.y*(1.0-q.x)*(1.0-q.y),0.18);
    col += hash(vec3(gl_FragCoord.xy,fract(time*60.0)))*0.025-0.012;
    col = (col*(2.51*col+0.03))/(col*(2.43*col+0.59)+0.14);
    col = pow(clamp(col,0.0,1.0),vec3(0.88));
    float ca = 0.001*length(uv);
    col.r *= 1.0+ca; col.b *= 1.0-ca;
    fragColor = vec4(col,1.0);
}
`;

// — GL —
function createShader(gl,type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(s));gl.deleteShader(s);return null;}return s;}
function createProgram(gl,v,f){const p=gl.createProgram();gl.attachShader(p,v);gl.attachShader(p,f);gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS)){console.error(gl.getProgramInfoLog(p));return null;}return p;}
const vsh=createShader(gl,gl.VERTEX_SHADER,vertSrc);
const fsh=createShader(gl,gl.FRAGMENT_SHADER,fragSrc);
const program=createProgram(gl,vsh,fsh);
const posLoc=gl.getAttribLocation(program,'a_pos');
const uRes=gl.getUniformLocation(program,'u_res');
const uTime=gl.getUniformLocation(program,'u_time');
const uRo=gl.getUniformLocation(program,'u_ro');
const uFwd=gl.getUniformLocation(program,'u_fwd');
const uRight=gl.getUniformLocation(program,'u_right');
const uUp=gl.getUniformLocation(program,'u_up');
const uZoom=gl.getUniformLocation(program,'u_zoom');
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const vao=gl.createVertexArray();gl.bindVertexArray(vao);
gl.enableVertexAttribArray(posLoc);gl.vertexAttribPointer(posLoc,2,gl.FLOAT,false,0,0);

// ——— Vector math ———
const v3={
add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
scale:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
normalize:(a)=>{const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1;return[a[0]/l,a[1]/l,a[2]/l];},
lerp:(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t],
};
function fract(x){return x-Math.floor(x);}
function hash3(n){return[fract(Math.sin(n)*43758.5453),fract(Math.sin(n+1)*22578.1459),fract(Math.sin(n+2)*19642.349)];}

let camPos=[0,0,0],camFwd=[0,0,1],camRight=[1,0,0],camUp=[0,1,0],camInit=false;
let paused=false,time=0;
let mouse=[0,0],targetMouse=[0,0];
let depthAccum=0,userRoll=0,rollSmooth=0;
let rightDragging=false,rightDragStartX=0,rightDragStartRoll=0;
let pinchStartDist=0,pinchStartAngle=0,pinchStartDepth=0,pinchStartRoll=0;
let wallPrev=0,started=false,fpsArr=[];
const MAX_DT=0.02,TIME_SPEED=0.7;

function rawCameraPath(t){return[1.8*Math.cos(t*0.097)+0.5*Math.sin(t*0.151),0.8*Math.sin(t*0.067)+0.35*Math.cos(t*0.127),1.8*Math.sin(t*0.109)+0.5*Math.cos(t*0.137)];}
function lookTarget(t){const c=9,ph=Math.floor(t/c),lt=fract(t/c),s=lt*lt*lt*(lt*(lt*6-15)+10),a=hash3(ph*17.31),b=hash3((ph+1)*17.31);return[(a[0]*3-1.5)+(b[0]*3-1.5-(a[0]*3-1.5))*s,(a[1]*3-1.5)+(b[1]*3-1.5-(a[1]*3-1.5))*s,(a[2]*3-1.5)+(b[2]*3-1.5-(a[2]*3-1.5))*s];}

function computeCamera(time,dt){
let dp=rawCameraPath(time);dp=v3.add(dp,v3.scale(camFwd,depthAccum));
let ta=lookTarget(time);ta=v3.add(ta,[mouse[0]*0.5,-mouse[1]*0.5,0]);
const az=1.2+0.6*Math.pow(0.5+0.5*Math.sin(time*0.027),2);
const roll=Math.sin(time*0.013)*0.1+rollSmooth;
let df=v3.normalize(v3.sub(ta,dp));
const up=[Math.sin(roll),Math.cos(roll),0];
let dr=v3.normalize(v3.cross(df,up)),du=v3.cross(dr,df);
if(!camInit){camPos=dp.slice();camFwd=df.slice();camRight=dr.slice();camUp=du.slice();camInit=true;}
else{const pr=1-Math.exp(-dt*1.5),or=1-Math.exp(-dt*1.2);
camPos=v3.lerp(camPos,dp,pr);camFwd=v3.normalize(v3.lerp(camFwd,df,or));
camRight=v3.normalize(v3.lerp(camRight,dr,or));camUp=v3.normalize(v3.lerp(camUp,du,or));}
return az;}

function resize(){const d=Math.min(window.devicePixelRatio,1);canvas.width=window.innerWidth*d;canvas.height=window.innerHeight*d;gl.viewport(0,0,canvas.width,canvas.height);}
resize();window.addEventListener('resize',resize);

canvas.addEventListener('mousemove',(e)=>{if(!rightDragging){targetMouse[0]=(e.clientX/window.innerWidth)*2-1;targetMouse[1]=(e.clientY/window.innerHeight)*2-1;}if(rightDragging){userRoll=rightDragStartRoll+(e.clientX-rightDragStartX)/window.innerWidth*Math.PI*2;}});
canvas.addEventListener('mouseleave',()=>{targetMouse[0]=0;targetMouse[1]=0;rightDragging=false;});
canvas.addEventListener('mousedown',(e)=>{if(e.button===2){rightDragging=true;rightDragStartX=e.clientX;rightDragStartRoll=userRoll;e.preventDefault();}});
canvas.addEventListener('mouseup',(e)=>{if(e.button===2)rightDragging=false;if(e.button===0&&!rightDragging)paused=!paused;});
canvas.addEventListener('contextmenu',(e)=>e.preventDefault());
canvas.addEventListener('wheel',(e)=>{e.preventDefault();let d=e.deltaY;if(e.deltaMode===1)d*=40;if(e.deltaMode===2)d*=800;if(e.shiftKey)userRoll+=d*0.002;else depthAccum+=d*0.002;},{passive:false});

function tDist(t){const dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY;return Math.sqrt(dx*dx+dy*dy);}
function tAngle(t){return Math.atan2(t[1].clientY-t[0].clientY,t[1].clientX-t[0].clientX);}
canvas.addEventListener('touchstart',(e)=>{e.preventDefault();if(e.touches.length===2){pinchStartDist=tDist(e.touches);pinchStartAngle=tAngle(e.touches);pinchStartDepth=depthAccum;pinchStartRoll=userRoll;}},{passive:false});
canvas.addEventListener('touchmove',(e)=>{e.preventDefault();if(e.touches.length===1){targetMouse[0]=(e.touches[0].clientX/window.innerWidth)*2-1;targetMouse[1]=(e.touches[0].clientY/window.innerHeight)*2-1;}if(e.touches.length===2){depthAccum=pinchStartDepth-(tDist(e.touches)/pinchStartDist-1)*4;userRoll=pinchStartRoll+(tAngle(e.touches)-pinchStartAngle);const cx=(e.touches[0].clientX+e.touches[1].clientX)/2,cy=(e.touches[0].clientY+e.touches[1].clientY)/2;targetMouse[0]=(cx/window.innerWidth)*2-1;targetMouse[1]=(cy/window.innerHeight)*2-1;}},{passive:false});
canvas.addEventListener('touchend',(e)=>{if(e.touches.length===0){targetMouse[0]=0;targetMouse[1]=0;}if(e.changedTouches.length>=3)paused=!paused;});
document.addEventListener('keydown',(e)=>{if(e.key===' '){paused=!paused;e.preventDefault();}if(e.key==='r'||e.key==='R'){depthAccum=0;userRoll=0;}if(e.key==='='||e.key==='+')depthAccum-=0.3;if(e.key==='-'||e.key==='_')depthAccum+=0.3;if(e.key==='[')userRoll-=0.15;if(e.key===']')userRoll+=0.15;});

function frame(wn){
requestAnimationFrame(frame);
if(!started){wallPrev=wn;started=true;return;}
const wd=(wn-wallPrev)/1000;wallPrev=wn;
const dt=Math.max(0,Math.min(wd,MAX_DT));
if(wd>0&&wd<1){fpsArr.push(wd);if(fpsArr.length>60)fpsArr.shift();document.getElementById('fps').textContent=(fpsArr.length/fpsArr.reduce((a,b)=>a+b)|0)+' fps';}
if(!paused)time+=dt*TIME_SPEED;
const sr=1-Math.exp(-dt*1.5);
mouse[0]+=(targetMouse[0]-mouse[0])*sr;
mouse[1]+=(targetMouse[1]-mouse[1])*sr;
rollSmooth+=(userRoll-rollSmooth)*(1-Math.exp(-dt*2.5));
const zoom=computeCamera(time,dt);
gl.useProgram(program);
gl.uniform2f(uRes,canvas.width,canvas.height);
gl.uniform1f(uTime,time);
gl.uniform3f(uRo,camPos[0],camPos[1],camPos[2]);
gl.uniform3f(uFwd,camFwd[0],camFwd[1],camFwd[2]);
gl.uniform3f(uRight,camRight[0],camRight[1],camRight[2]);
gl.uniform3f(uUp,camUp[0],camUp[1],camUp[2]);
gl.uniform1f(uZoom,zoom);
gl.bindVertexArray(vao);
gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
